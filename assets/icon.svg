<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">
  <title id="title">Stream Layout Cute Cat Monitor Icon</title>
  <desc id="desc">A cute kawaii TV monitor with cat ears and 4 colorful stream layout panels with a friendly smiling face.</desc>
  <defs>
    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#1e1b4b" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Cat Ears -->
  <path d="M22 36 C16 10, 34 5, 46 22 Z" fill="#eeeaf8" stroke="#251c4a" stroke-width="4.5" stroke-linejoin="round"/>
  <path d="M25 34 C21 15, 34 11, 41 24 Z" fill="#ffa8bc"/>

  <path d="M106 36 C112 10, 94 5, 82 22 Z" fill="#eeeaf8" stroke="#251c4a" stroke-width="4.5" stroke-linejoin="round"/>
  <path d="M103 34 C107 15, 94 11, 87 24 Z" fill="#ffa8bc"/>

  <!-- TV Body Outer Frame (Full-frame squircle) -->
  <rect x="8" y="20" width="112" height="100" rx="24" fill="#f4f1fa" stroke="#251c4a" stroke-width="6" filter="url(#soft-shadow)"/>

  <!-- TV Screen Inner Bezel -->
  <rect x="16" y="28" width="96" height="84" rx="16" fill="#251c4a"/>

  <!-- 4 Stream Layout Panes -->
  <g clip-path="url(#screen-clip)">
    <clipPath id="screen-clip">
      <rect x="18" y="30" width="92" height="80" rx="14"/>
    </clipPath>
    <!-- Pane 1: Top-Left (Lavender) -->
    <rect x="18" y="30" width="45" height="39" fill="#b8a7f9"/>
    <!-- Pane 2: Top-Right (Mint) -->
    <rect x="65" y="30" width="45" height="39" fill="#72e2ba"/>
    <!-- Pane 3: Bottom-Left (Coral Pink) -->
    <rect x="18" y="71" width="45" height="39" fill="#ff7f79"/>
    <!-- Pane 4: Bottom-Right (Sunny Yellow) -->
    <rect x="65" y="71" width="45" height="39" fill="#ffd55c"/>

    <!-- Play Icons in Panes -->
    <polygon points="36,44 36,54 44,49" fill="#8f7ce0" opacity="0.65"/>
    <polygon points="85,44 85,54 93,49" fill="#44b88f" opacity="0.65"/>
    <polygon points="36,85 36,95 44,90" fill="#e05b54" opacity="0.65"/>
    <polygon points="85,85 85,95 93,90" fill="#deb133" opacity="0.65"/>

    <!-- Screen Highlight Glare -->
    <path d="M22 34 C32 34, 25 48, 25 48" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.85"/>
  </g>

  <!-- Central Cute Mascot Face (Squircle Pill) -->
  <rect x="38" y="52" width="52" height="36" rx="18" fill="#ffffff" stroke="#251c4a" stroke-width="4"/>

  <!-- Eyes -->
  <circle cx="49" cy="67" r="4" fill="#251c4a"/>
  <circle cx="79" cy="67" r="4" fill="#251c4a"/>

  <!-- Cheeks -->
  <ellipse cx="45" cy="74" rx="4" ry="2.5" fill="#ff8aa5"/>
  <ellipse cx="83" cy="74" rx="4" ry="2.5" fill="#ff8aa5"/>

  <!-- Smile -->
  <path d="M59 70 Q64 77 69 70" fill="none" stroke="#251c4a" stroke-width="3.5" stroke-linecap="round"/>
</svg>
