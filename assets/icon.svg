<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">
  <title id="title">Stream Layout Cute Cat Monitor Icon</title>
  <desc id="desc">High-contrast cute cat TV monitor with 4 colorful stream layout panels and a friendly smiling face.</desc>
  <defs>
    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#0a0715" flood-opacity="0.35"/>
    </filter>
    <clipPath id="screen-clip">
      <rect x="16" y="34" width="96" height="76" rx="14"/>
    </clipPath>
  </defs>

  <!-- Cat Ears -->
  <!-- Left Ear -->
  <polygon points="18,38 28,6 48,28" fill="#18132e" stroke="#18132e" stroke-width="4" stroke-linejoin="round"/>
  <polygon points="22,34 29,14 42,28" fill="#ff708f"/>

  <!-- Right Ear -->
  <polygon points="110,38 100,6 80,28" fill="#18132e" stroke="#18132e" stroke-width="4" stroke-linejoin="round"/>
  <polygon points="106,34 99,14 86,28" fill="#ff708f"/>

  <!-- TV Chassis Outer Frame -->
  <rect x="8" y="24" width="112" height="96" rx="24" fill="#18132e" stroke="#2c2452" stroke-width="2" filter="url(#soft-shadow)"/>

  <!-- TV Screen Inner Bezel -->
  <rect x="14" y="32" width="100" height="80" rx="16" fill="#0c0919"/>

  <!-- 4 Stream Layout Panes -->
  <g clip-path="url(#screen-clip)">
    <!-- Top-Left: Twitch Violet -->
    <rect x="16" y="34" width="47" height="37" fill="#9a62ff"/>
    <!-- Top-Right: Kick Green -->
    <rect x="65" y="34" width="47" height="37" fill="#05d672"/>
    <!-- Bottom-Left: Live Coral Red -->
    <rect x="16" y="73" width="47" height="37" fill="#ff4d6a"/>
    <!-- Bottom-Right: Sunny Amber Gold -->
    <rect x="65" y="73" width="47" height="37" fill="#ffbe1a"/>

    <!-- Screen Highlight Glare -->
    <path d="M22 40 C32 40, 26 52, 26 52" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
  </g>

  <!-- Center Cute Mascot Face Pill -->
  <rect x="34" y="52" width="60" height="40" rx="20" fill="#ffffff" stroke="#18132e" stroke-width="4"/>

  <!-- Eyes -->
  <circle cx="48" cy="70" r="4.5" fill="#18132e"/>
  <circle cx="80" cy="70" r="4.5" fill="#18132e"/>
  <circle cx="46.8" cy="68.8" r="1.4" fill="#ffffff"/>
  <circle cx="78.8" cy="68.8" r="1.4" fill="#ffffff"/>

  <!-- Cheeks -->
  <ellipse cx="43" cy="77" rx="4" ry="2.2" fill="#ff7a99"/>
  <ellipse cx="85" cy="77" rx="4" ry="2.2" fill="#ff7a99"/>

  <!-- Smile -->
  <path d="M57 73 Q64 80 71 73" fill="none" stroke="#18132e" stroke-width="3.5" stroke-linecap="round"/>
</svg>
