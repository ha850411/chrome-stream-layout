<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Live player</title>
  <link rel="stylesheet" href="src/live-player.css">
  <link rel="stylesheet" href="src/glass-menu.css">
</head>
<body>
  <main id="player" tabindex="0">
    <video id="video" playsinline></video>
    <div class="player-shade" aria-hidden="true"></div>
    <div class="player-feedback">
      <div class="player-feedback-card glass-surface">
        <div class="feedback-indicator" aria-hidden="true">
          <div class="loading-ring-wrap">
            <svg class="loading-ring" viewBox="0 0 44 44" width="38" height="38">
              <circle class="ring-track" cx="22" cy="22" r="18" fill="none" stroke="rgba(255, 255, 255, 0.1)" stroke-width="2.5"/>
              <circle class="ring-spinner" cx="22" cy="22" r="18" fill="none" stroke="url(#ring-grad)" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="68 45"/>
              <defs>
                <linearGradient id="ring-grad" x1="0%" y1="0%" x2="100%" y2="100%">
                  <stop offset="0%" stop-color="#c4b5fd"/>
                  <stop offset="55%" stop-color="#a78bfa"/>
                  <stop offset="100%" stop-color="#f472b6"/>
                </linearGradient>
              </defs>
            </svg>
            <div class="indicator-mascot">
              <svg viewBox="0 0 32 32" width="20" height="20">
                <polygon points="4,10 7,2 12,8" fill="#18132e"/>
                <polygon points="5,9 7,4 10,7" fill="#ff708f"/>
                <polygon points="28,10 25,2 20,8" fill="#18132e"/>
                <polygon points="27,9 25,4 22,7" fill="#ff708f"/>
                <rect x="2" y="7" width="28" height="23" rx="6" fill="#18132e"/>
                <rect x="4" y="9" width="11" height="9" rx="2" fill="#9a62ff"/>
                <rect x="17" y="9" width="11" height="9" rx="2" fill="#05d672"/>
                <rect x="4" y="19" width="11" height="9" rx="2" fill="#ff4d6a"/>
                <rect x="17" y="19" width="11" height="9" rx="2" fill="#ffbe1a"/>
                <rect x="9" y="13" width="14" height="11" rx="5.5" fill="#ffffff" stroke="#18132e" stroke-width="1.2"/>
                <circle cx="13" cy="18" r="1.2" fill="#18132e"/>
                <circle cx="19" cy="18" r="1.2" fill="#18132e"/>
                <path d="M15 20 Q16 21.5 17 20" stroke="#18132e" stroke-width="0.9" fill="none" stroke-linecap="round"/>
              </svg>
            </div>
          </div>
          <div class="error-mascot-wrap">
            <svg viewBox="0 0 44 44" width="40" height="40">
              <polygon points="6,15 11,3 18,12" fill="#18132e"/>
              <polygon points="8,14 11,6 15,11" fill="#ff708f"/>
              <polygon points="38,15 33,3 26,12" fill="#18132e"/>
              <polygon points="36,14 33,6 29,11" fill="#ff708f"/>
              <rect x="3" y="10" width="38" height="31" rx="8" fill="#18132e" stroke="#352b5e" stroke-width="2"/>
              <rect x="6" y="13" width="32" height="25" rx="6" fill="#131024"/>
              <rect x="12" y="19" width="20" height="13" rx="6.5" fill="#ffffff" stroke="#18132e" stroke-width="1.5"/>
              <path d="M16 25 Q18 28 20 25" stroke="#18132e" stroke-width="1.8" fill="none" stroke-linecap="round"/>
              <path d="M24 25 Q26 28 28 25" stroke="#18132e" stroke-width="1.8" fill="none" stroke-linecap="round"/>
              <circle cx="14" cy="27" r="1.5" fill="#ff7a99" opacity="0.8"/>
              <circle cx="30" cy="27" r="1.5" fill="#ff7a99" opacity="0.8"/>
            </svg>
          </div>
        </div>
        <div class="feedback-body">
          <p id="message" role="status"></p>
          <div class="loading-dots" aria-hidden="true">
            <span class="dot dot-1"></span>
            <span class="dot dot-2"></span>
            <span class="dot dot-3"></span>
          </div>
        </div>
        <div id="errorActions" class="error-actions" hidden>
          <button id="retrySource" type="button">重試</button>
          <button id="editSource" type="button">編輯來源</button>
          <a id="openSource" target="_blank" rel="noopener noreferrer">原站開啟</a>
        </div>
      </div>
    </div>
    <span id="platform" class="platform-badge glass-surface"></span>
    <button id="centerPlay" class="center-play-button glass-surface" type="button" data-state="paused" disabled hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path class="play-symbol" d="M8 5.5c0-.8.9-1.3 1.6-.9l9.5 6.5a1.1 1.1 0 0 1 0 1.8l-9.5 6.5A1.1 1.1 0 0 1 8 18.5Z"/>
        <g class="pause-symbol"><rect x="7" y="5" width="3" height="14" rx="1"/><rect x="14" y="5" width="3" height="14" rx="1"/></g>
      </svg>
    </button>
    <div id="controls" class="player-toolbar glass-surface" role="group" aria-label="播放控制">
      <button id="play" type="button" disabled>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path id="playIcon" d="m8 5 11 7-11 7Z"/></svg>
      </button>
      <button id="mute" type="button" disabled>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4Z"/><path id="soundIcon" d="m17 9 5 6m0-6-5 6"/></svg>
      </button>
      <button id="live" class="live-button" type="button" disabled><span class="live-dot" aria-hidden="true"></span>LIVE</button>
      <div id="playerOptions" class="player-options glass-surface">
        <label class="volume-option">
          <span id="volumeLabel">音量</span>
          <input id="volume" type="range" min="0" max="1" step="0.05" value="1" disabled>
          <span id="volumeValue" class="volume-value" aria-hidden="true">100%</span>
        </label>
        <div class="quality-option">
          <span id="qualityLabel">畫質</span>
          <button id="quality" type="button" value="auto" aria-haspopup="menu" aria-expanded="false" aria-controls="qualityMenu" disabled>
            <span id="qualityValue">自動</span><svg viewBox="0 0 16 16" aria-hidden="true"><path d="m4 6 4 4 4-4"/></svg>
          </button>
        </div>
        <button id="fullscreen" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5m6 0h5v5m0 6v5h-5m-6 0H4v-5"/></svg><span id="fullscreenLabel">全螢幕</span>
        </button>
      </div>
      <button id="more" class="more-button" type="button" aria-expanded="false" aria-controls="playerOptions" aria-label="更多播放設定">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></svg>
      </button>
    </div>
    <div id="qualityMenu" class="quality-menu glass-menu" role="menu" aria-labelledby="qualityLabel" hidden></div>
  </main>
  <script src="src/vendor/ivs/amazon-ivs-player.min.js"></script>
  <script src="src/live-engine.js"></script>
  <script src="src/live-player.js"></script>
</body>
</html>
