<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Stream Layout</title>
    <link rel="stylesheet" href="src/dashboard.css">
    <link rel="stylesheet" href="src/glass-menu.css">
  </head>
  <body>
    <nav class="view-tools" id="viewTools" aria-label="Viewing controls">
      <div class="view-tools-bar">
        <button id="openControlsButton" type="button" aria-controls="controlOverlay" aria-expanded="false">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="8" height="16" rx="2"></rect><rect x="14" y="4" width="7" height="7" rx="2"></rect><rect x="14" y="14" width="7" height="6" rx="2"></rect></svg>
          <span id="openControlsLabel">Sources and layout</span>
        </button>
        <button class="icon-button" id="viewFullscreenButton" type="button" title="Layout fullscreen" aria-label="Layout fullscreen"></button>
      </div>
    </nav>
    <main class="app-shell">
      <section class="stage layout-4" id="stage" aria-label="Stream Layout"></section>
    </main>

    <div class="control-overlay" id="controlOverlay" hidden>
      <section class="control-dialog" role="dialog" aria-modal="true" aria-labelledby="controlsTitle">
        <form class="stream-form" id="streamForm">
          <div class="dialog-head">
            <div class="dialog-brand">
              <span class="brand-mark" aria-hidden="true">
                <img class="brand-mascot-img" src="assets/icon128.png" alt="" width="28" height="28">
              </span>
              <div>
                <h1 id="controlsTitle">Stream Layout</h1>
                <p id="controlsSubtitle">Sources and layout</p>
              </div>
            </div>
            <div class="dialog-head-actions">
              <div class="language-picker" id="languagePicker">
                <button class="language-button" id="languageButton" type="button" aria-haspopup="menu" aria-expanded="false" aria-controls="languageMenu" aria-label="Language" title="Language">
                  <span id="languageValue">EN</span>
                  <svg viewBox="0 0 16 16" aria-hidden="true"><path d="m4 6 4 4 4-4"/></svg>
                </button>
                <div class="language-menu glass-menu" id="languageMenu" role="menu" aria-labelledby="languageButton" hidden>
                  <button type="button" role="menuitemradio" aria-checked="false" tabindex="-1" data-language="zh-TW" lang="zh-Hant">
                    <span>繁體中文</span><svg viewBox="0 0 16 16" aria-hidden="true"><path d="m3 8 3 3 7-7"/></svg>
                  </button>
                  <button type="button" role="menuitemradio" aria-checked="true" tabindex="-1" data-language="en" lang="en">
                    <span>English</span><svg viewBox="0 0 16 16" aria-hidden="true"><path d="m3 8 3 3 7-7"/></svg>
                  </button>
                </div>
              </div>
              <button class="icon-button" id="reloadAllButton" type="button" title="Reload all" aria-label="Reload all">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M21 12a9 9 0 0 1-15.4 6.4M3 12A9 9 0 0 1 18.4 5.6"></path>
                  <path d="M18 2v4h4M6 22v-4H2"></path>
                </svg>
              </button>

              <button class="icon-button" id="dialogFullscreenButton" type="button" title="Layout fullscreen" aria-label="Layout fullscreen"></button>

              <button class="icon-button" id="closeControlsButton" type="button" title="Close" aria-label="Close">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M18 6 6 18M6 6l12 12"></path>
                </svg>
              </button>
            </div>
          </div>

          <div class="layout-switch" role="group" aria-label="Pane count">
            <button class="segment" type="button" data-layout="2" aria-pressed="false">2</button>
            <button class="segment" type="button" data-layout="3" aria-pressed="false">3</button>
            <button class="segment" type="button" data-layout="4" aria-pressed="false">4</button>
          </div>

          <div class="layout-actions">
            <button class="maximize-layout-button" id="maximizeLayoutButton" type="button">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3H3v5M16 3h5v5M21 16v5h-5M8 21H3v-5"></path><path d="m3 3 6 6m12-6-6 6m6 12-6-6M3 21l6-6"></path></svg>
              <span id="maximizeLayoutLabel">Fit to window</span>
            </button>
            <button class="maximize-layout-button" id="fullscreenButton" type="button">
              <span id="fullscreenIcon" aria-hidden="true"></span>
              <span id="fullscreenLabel">Layout fullscreen</span>
            </button>
          </div>

          <div class="storage-notice" id="storageNotice" role="alert" hidden>
            <span id="storageMessage"></span>
            <button class="text-button" id="retrySaveButton" type="button">Retry save</button>
          </div>
          <p class="playback-notice" id="playbackNotice" role="status" hidden></p>
          <div class="slot-controls" id="slotControls"></div>

          <div class="form-footer">
            <div class="source-menu-notice" id="sourceMenuNotice" role="status" hidden>
              <span id="sourceMenuMessage"></span>
              <button class="text-button" id="dismissSourceMenuButton" type="button">Dismiss</button>
            </div>
            <div class="draft-notice" id="draftNotice" hidden>
              <span id="pendingStatus" role="status"></span>
              <button class="text-button" id="discardButton" type="button">Discard changes</button>
            </div>
            <div class="undo-notice" id="undoNotice" hidden>
              <span id="undoMessage" role="status"></span>
              <button class="text-button" id="undoButton" type="button">Undo</button>
            </div>
            <div class="form-actions">
              <button class="text-button clear-all-button" id="clearButton" type="button">Clear all</button>
              <span id="saveStatus" aria-live="polite"></span>
              <button class="primary-button" id="applyButton" type="submit">Done</button>
            </div>
          </div>
        </form>
      </section>
    </div>

    <script src="src/state-model.js"></script>
    <script src="src/i18n.js"></script>
    <script src="src/storage.js"></script>
    <script src="src/sources.js"></script>
    <script src="src/twitch-source.js"></script>
    <script src="src/live-recovery.js"></script>
    <script src="src/live-host.js"></script>
    <script src="src/dashboard-ui.js"></script>
    <script src="src/dashboard.js"></script>
  </body>
</html>
